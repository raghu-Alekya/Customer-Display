apply plugin: 'com.android.application'

android {
    namespace 'com.creditcall.chipdnamobiledemo'

    defaultConfig {
        compileSdk 35
        applicationId 'com.creditcall.chipdnamobiledemo'
        minSdkVersion 31
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

//    Enable TTM
